[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
# src-tauri needs WebKitGTK on Linux; plain `cargo` commands build only the core.
default-members = ["crates/core", "src-tauri"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
