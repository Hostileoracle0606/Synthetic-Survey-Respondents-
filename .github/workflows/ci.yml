name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Rust core (fmt, clippy, tests, generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p survey-core --all-targets -- -D warnings
      - run: cargo test -p survey-core
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- src/types/gen

  web:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  app:
    name: Windows app (build, size budget)
    runs-on: windows-latest
    needs: [core, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - run: cargo clippy -p survey-app -- -D warnings
      - run: pnpm tauri build
      - name: Installers are under 15 MB
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse target/release/bundle -Include *.msi,*-setup.exe
          if ($files.Count -eq 0) { throw "no installers found" }
          foreach ($f in $files) {
            $mb = [math]::Round($f.Length / 1MB, 2)
            Write-Host "$($f.Name): $mb MB"
            if ($f.Length -gt 15MB) { throw "$($f.Name) is $mb MB, over the 15 MB budget" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
