name: Release

# Tag vX.Y.Z to build, sign (when a certificate is configured), smoke-test and publish a
# draft release. TEST_PLAN S14 (packaging and install) and §6 (Windows VMs).

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # Branch pushes run only when the pipeline itself changes (paths are not checked for tags),
    # to exercise it without publishing.
    paths:
      - ".github/workflows/release.yml"
      - "crates/evals/**"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and sign installers
    runs-on: windows-latest
    env:
      CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - run: pnpm tauri build
      # Authenticode: runs only when the WINDOWS_CERTIFICATE secret (base64 .pfx) is set.
      # Without it the installers ship unsigned, and the summary says so (open decision).
      - name: Sign installers
        if: env.CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $files = Get-ChildItem -Recurse target/release/bundle -Include *.msi,*-setup.exe
          foreach ($f in $files) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing $($f.Name) failed" }
            & $signtool.FullName verify /pa $f.FullName   # TEST_PLAN S14 signature_valid
            if ($LASTEXITCODE -ne 0) { throw "signature on $($f.Name) does not verify" }
          }
          Remove-Item $pfx
      - name: Unsigned build notice
        if: env.CERT_PFX_BASE64 == ''
        shell: pwsh
        run: echo "::warning::No WINDOWS_CERTIFICATE secret; installers are unsigned (SmartScreen will warn users)."
      - name: Installers are under 15 MB
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse target/release/bundle -Include *.msi,*-setup.exe) {
            $mb = [math]::Round($f.Length / 1MB, 2); Write-Host "$($f.Name): $mb MB"
            if ($f.Length -gt 15MB) { throw "$($f.Name) is $mb MB, over the 15 MB budget" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  install-smoke:
    name: Install, launch, uninstall (${{ matrix.kind }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Smoke test
        shell: pwsh
        run: |
          $pattern = if ('${{ matrix.kind }}' -eq 'msi') { '*.msi' } else { '*-setup.exe' }
          $installer = Get-ChildItem -Recurse installers -Filter $pattern | Select-Object -First 1
          ./scripts/release/install-smoke.ps1 -Installer $installer.FullName

  upgrade-keeps-data:
    name: Upgrade preserves projects (${{ matrix.kind }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - run: cargo build --release -p survey-evals --bin release-db
      - name: Find the previous release installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pattern = if ('${{ matrix.kind }}' -eq 'msi') { '*.msi' } else { '*-setup.exe' }
          $current = Get-ChildItem -Recurse installers -Filter $pattern | Select-Object -First 1
          if (-not $current) { throw "current ${{ matrix.kind }} installer not found" }
          $previous = $null
          $releases = @(gh release list --exclude-drafts --limit 1 --json tagName | ConvertFrom-Json)
          if ($releases.Count) {
            New-Item -ItemType Directory -Force previous | Out-Null
            gh release download $releases[0].tagName --pattern $pattern --dir previous
            if ($LASTEXITCODE -ne 0) { throw 'could not download the previous release' }
            $previous = Get-ChildItem -Recurse previous -Filter $pattern | Select-Object -First 1
          }
          if (-not $previous) {
            $previous = $current
            Write-Host '::notice::No earlier published release exists; running the first-release reinstall rehearsal.'
          }
          "current=$($current.FullName)" | Add-Content $env:GITHUB_OUTPUT
          "previous=$($previous.FullName)" | Add-Content $env:GITHUB_OUTPUT
      - name: Install previous, upgrade, and verify data
        shell: pwsh
        run: >-
          ./scripts/release/upgrade-keeps-data.ps1
          -PreviousInstaller '${{ steps.previous.outputs.previous }}'
          -CurrentInstaller '${{ steps.previous.outputs.current }}'
          -DbTool target/release/release-db.exe

  network-egress:
    name: Application network egress
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Require the live-test key for version tags
        id: live
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            if ('${{ github.ref_type }}' -eq 'tag') {
              throw 'A version tag requires GEMINI_API_KEY for the network-egress release check.'
            }
            'enabled=false' | Add-Content $env:GITHUB_OUTPUT
            Write-Host '::notice::GEMINI_API_KEY is absent; the branch pipeline skips the live egress check.'
          } else {
            'enabled=true' | Add-Content $env:GITHUB_OUTPUT
          }
      - name: Capture and validate application egress
        if: steps.live.outputs.enabled == 'true'
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $installer = Get-ChildItem -Recurse installers -Filter '*.msi' | Select-Object -First 1
          ./scripts/release/network-egress.ps1 -Installer $installer.FullName

  # Windows 11 VMs from TEST_PLAN §6, registered as self-hosted runners. Set the repository
  # variable RELEASE_VMS to "true" once they exist; until then these jobs are skipped.
  win11-clean:
    name: Clean install on Windows 11 VM
    needs: build
    if: vars.RELEASE_VMS == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, win11-clean]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - shell: pwsh
        run: |
          foreach ($i in Get-ChildItem -Recurse installers -Include *.msi,*-setup.exe) {
            ./scripts/release/install-smoke.ps1 -Installer $i.FullName
          }

  win10-clean:
    name: Windows 10 bootstrap without WebView2
    needs: build
    if: vars.RELEASE_VMS == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, win10-clean]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Install WebView2 through the bootstrapper and launch
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse installers -Filter '*-setup.exe' | Select-Object -First 1
          ./scripts/release/webview2-bootstrap-smoke.ps1 -Installer $installer.FullName

  # TEST_PLAN S7 memory_1000 and S10 stream_fps_1000 (BACKLOG B14) on GitHub's windows-latest:
  # a performance-harness build (mock Gemini, no key) streams 1,000 respondents x 20 questions
  # while memory is sampled and frames are recorded. Memory is enforced; frames are warn-only
  # because these runners have no GPU (TEST_PLAN §6).
  perf:
    name: Memory and frame rate, 1,000 respondents streaming
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - run: cargo clippy -p survey-app --features perf -- -D warnings
      - name: Build the app with the perf harness
        # perf.tauri.conf.json opens the WebView2 DevTools port the harness drives.
        run: pnpm tauri build --no-bundle --features perf --config scripts/release/perf.tauri.conf.json
        env:
          VITE_PERF_HARNESS: "1"
      - run: cargo build --release -p survey-evals --bin mock-gemini --bin perf-seed
      - name: Stream 1,000 respondents (3 runs, median)
        shell: pwsh
        run: ./scripts/release/perf-1000.ps1 -App target/release/survey-app.exe -Mock target/release/mock-gemini.exe -Seed target/release/perf-seed.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results

  win11-perf:
    name: Windows 11 GPU performance gate
    if: vars.RELEASE_VMS == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, win11-perf]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - run: cargo clippy -p survey-app --features perf -- -D warnings
      - name: Build the app with the perf harness
        run: pnpm tauri build --no-bundle --features perf --config scripts/release/perf.tauri.conf.json
        env:
          VITE_PERF_HARNESS: "1"
      - run: cargo build --release -p survey-evals --bin mock-gemini --bin perf-seed
      - name: Enforce memory and frame-rate budgets on the GPU VM
        shell: pwsh
        run: ./scripts/release/perf-1000.ps1 -App target/release/survey-app.exe -Mock target/release/mock-gemini.exe -Seed target/release/perf-seed.exe -StrictFps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win11-perf-results
          path: perf-results

  publish:
    name: Draft GitHub release
    needs: [build, install-smoke, upgrade-keeps-data, network-egress, perf, win11-clean, win10-clean, win11-perf]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**/*
