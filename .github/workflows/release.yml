name: Release

# Tag vX.Y.Z to build, sign, smoke-test and publish a draft release. Branch and manual runs
# may build unsigned to exercise the pipeline. TEST_PLAN S14 and §6 (Windows VMs).

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # Branch pushes run only when the pipeline itself changes (paths are not checked for tags),
    # to exercise it without publishing.
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and sign installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - name: Prepare Windows code signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/prepare-signing.ps1
      - name: Build application and installers
        shell: pwsh
        env:
          TAURI_SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          if ($env:TAURI_SIGNING_CONFIG) {
            pnpm tauri build --config $env:TAURI_SIGNING_CONFIG
          } else {
            pnpm tauri build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Tauri build failed' }
      - name: Verify application and installer signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: ./scripts/release/verify-signatures.ps1 -ExpectedThumbprint $env:EXPECTED_THUMBPRINT
      - name: Unsigned build notice
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: Write-Host '::warning::This non-tag pipeline check is unsigned. Version tags require a trusted certificate.'
      - name: Installers are under 15 MB
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem -Recurse target/release/bundle -Include *.msi,*-setup.exe) {
            $mb = [math]::Round($f.Length / 1MB, 2); Write-Host "$($f.Name): $mb MB"
            if ($f.Length -gt 15MB) { throw "$($f.Name) is $mb MB, over the 15 MB budget" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
      - name: Remove signing certificate from runner
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
          TAURI_SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
        run: |
          Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          Remove-Item $env:TAURI_SIGNING_CONFIG -Force -ErrorAction SilentlyContinue

  install-smoke:
    name: Install, launch, uninstall (${{ matrix.kind }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - name: Smoke test
        shell: pwsh
        run: |
          $pattern = if ('${{ matrix.kind }}' -eq 'msi') { '*.msi' } else { '*-setup.exe' }
          $installer = Get-ChildItem -Recurse installers -Filter $pattern | Select-Object -First 1
          ./scripts/release/install-smoke.ps1 -Installer $installer.FullName

  # Windows 11 VMs from TEST_PLAN §6, registered as self-hosted runners. Set the repository
  # variable RELEASE_VMS to "true" once they exist; until then these jobs are skipped.
  win11-clean:
    name: Clean install on Windows 11 VM
    needs: build
    if: vars.RELEASE_VMS == 'true'
    runs-on: [self-hosted, win11-clean]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - shell: pwsh
        run: |
          foreach ($i in Get-ChildItem -Recurse installers -Include *.msi,*-setup.exe) {
            ./scripts/release/install-smoke.ps1 -Installer $i.FullName
          }

  # TEST_PLAN S7 memory_1000 and S10 stream_fps_1000 (BACKLOG B14) on GitHub's windows-latest:
  # a performance-harness build (mock Gemini, no key) streams 1,000 respondents x 20 questions
  # while memory is sampled and frames are recorded. Memory is enforced; frames are warn-only
  # because these runners have no GPU (TEST_PLAN §6).
  perf:
    name: Memory and frame rate, 1,000 respondents streaming
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri icon src-tauri/app-icon.png
      - run: cargo clippy -p survey-app --features perf -- -D warnings
      - name: Build the app with the perf harness
        # perf.tauri.conf.json opens the WebView2 DevTools port the harness drives.
        run: pnpm tauri build --no-bundle --features perf --config scripts/release/perf.tauri.conf.json
        env:
          VITE_PERF_HARNESS: "1"
      - run: cargo build --release -p survey-evals --bin mock-gemini --bin perf-seed
      - name: Stream 1,000 respondents (3 runs, median)
        shell: pwsh
        run: ./scripts/release/perf-1000.ps1 -App target/release/survey-app.exe -Mock target/release/mock-gemini.exe -Seed target/release/perf-seed.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results

  publish:
    name: Draft GitHub release
    needs: [build, install-smoke, perf]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installers/**/*
