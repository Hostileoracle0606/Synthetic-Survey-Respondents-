[package]
name = "survey-core"
version = "0.1.0"
description = "Engine, storage and Gemini adapter for the synthetic survey harness (no UI dependencies)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
rand = "0.9.5"
rand_chacha = "0.9.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "=2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"
