[package]
name = "survey-evals"
version = "0.1.0"
description = "Offline tools, never shipped: the fidelity benchmark (TEST_PLAN S13) and prompt-behaviour evals with a Gemini judge (S12)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
survey-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3.27.0"
